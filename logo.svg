
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Classic Windows 98 desktop-gray background -->
  <rect width="256" height="256" rx="20" fill="#C0C0C0"/>

  <!-- Raised outer border -->
  <path d="M20 20 H236 V236 H20 Z"
        fill="none" stroke="#FFFFFF" stroke-width="4"/>
  <path d="M24 232 H232 V24"
        fill="none" stroke="#808080" stroke-width="4"/>

  <!-- Document -->
  <path d="M70 43 H145 L187 85 V207 H70 Z"
        fill="#FFFFFF"
        stroke="#000000"
        stroke-width="4"
        stroke-linejoin="miter"/>

  <!-- Folded corner -->
  <path d="M145 43 V85 H187"
        fill="#C0C0C0"
        stroke="#000000"
        stroke-width="4"
        stroke-linejoin="miter"/>

  <!-- Document lines -->
  <g stroke="#808080" stroke-width="5">
    <path d="M91 108 H164"/>
    <path d="M91 124 H153"/>
  </g>

  <!-- Compression arrows: classic Windows blue -->
  <g fill="none"
     stroke="#000080"
     stroke-width="7"
     stroke-linecap="square"
     stroke-linejoin="miter">
    <path d="M87 153 H119 M109 143 L119 153 L109 163"/>
    <path d="M169 180 H137 M147 170 L137 180 L147 190"/>
  </g>

  <!-- Small Windows 98-style highlight -->
  <path d="M30 30 H226"
        stroke="#FFFFFF"
        stroke-width="2"/>
</svg>